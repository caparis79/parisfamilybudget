<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Household Budget</title>
<style>
:root{--bg:#eef2f4;--surface:#fff;--ink:#14232e;--muted:#5f7280;--line:#d5dde2;--accent:#0f766e;--accent-ink:#fff;--pos:#15803d;--neg:#b4412f}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a21;--surface:#17252e;--ink:#e6eef2;--muted:#8fa3b0;--line:#2a3b46;--accent:#4fb8ad;--accent-ink:#0f1a21;--pos:#5fd08a;--neg:#e88a76}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Avenir Next","Segoe UI",system-ui,sans-serif}
main{max-width:920px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.4rem;margin:0}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.num{font-variant-numeric:tabular-nums}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}
input,select,button{font:inherit;color:inherit}
input,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
button{padding:9px 16px;border:1px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.link{border:0;background:none;color:var(--muted);padding:4px 6px}
button.link:hover{color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:16px}
.tab{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;color:var(--muted);white-space:nowrap}
.tab[aria-selected=true]{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stats small{color:var(--muted);display:block}
.stats b{font-size:1.5rem;letter-spacing:-.01em}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;align-items:end}
.wide{grid-column:span 2}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:.85rem;color:var(--muted);font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.r{text-align:right}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.amt{font-weight:600;white-space:nowrap}
.note{color:var(--muted);font-size:.92rem}
.empty{color:var(--muted);padding:8px 0}
.err{color:var(--neg);font-size:.9rem;min-height:1.2em;margin:8px 0 0}
.scroll{overflow-x:auto}
.hidden{display:none}
.track{flex:1;height:10px;background:var(--bg);border-radius:5px;overflow:hidden}.fill{height:100%;background:var(--accent)}
@media (max-width:560px){.stats b{font-size:1.15rem}.wide{grid-column:span 1}}
</style>
</head>
<body>
<main>

<section id="login" class="panel hidden" style="max-width:380px;margin:60px auto">
  <h1>Household Budget</h1>
  <p style="color:var(--muted)">Sign in with your household account.</p>
  <label for="em">Email</label><input id="em" type="email" autocomplete="username">
  <label for="pw" style="margin-top:10px">Password</label><input id="pw" type="password" autocomplete="current-password">
  <p class="err" id="loginErr"></p>
  <button class="primary" id="signIn">Sign in</button>
</section>

<section id="app" class="hidden">
  <header>
    <h1>Household Budget</h1>
    <div><span id="who" style="color:var(--muted);font-size:.9rem"></span> <button class="link" id="signOut">Sign out</button></div>
  </header>

  <div class="tabs" id="tabs" role="tablist"></div>

  <div id="noPeriod" class="panel hidden">
    <p class="empty">No budget periods yet. Create one to start adding transactions.</p>
    <button class="primary" id="firstPeriod">Create first period</button>
  </div>

  <div id="periodView" class="hidden">
    <div class="panel stats">
      <div><small>Credits</small><b class="num pos" id="sCr">$0.00</b></div>
      <div><small>Debits</small><b class="num neg" id="sDb">$0.00</b></div>
      <div><small>Balance</small><b class="num" id="sNet">$0.00</b></div>
    </div>

    <div class="panel">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><b>Spending by category</b><button id="catBtn">Manage categories</button></div>
      <div id="catMgr" class="hidden" style="margin:10px 0 14px">
        <div style="display:flex;gap:8px"><input id="newCat" placeholder="New category, e.g. Groceries"><button class="primary" id="addCat">Add</button></div>
        <div id="catList"></div>
      </div>
      <div class="scroll" id="breakdown"></div>
    </div>

    <div class="panel">
      <form id="form" class="grid" onsubmit="return false">
        <div><label for="date">Date</label><input id="date" type="date" required></div>
        <div class="wide"><label for="desc">Description</label><input id="desc" required placeholder="Paycheck, Costco run"></div>
        <div><label for="type">Type</label><select id="type"><option value="debit">Debit (money out)</option><option value="credit">Credit (money in)</option></select></div>
        <div><label for="amount">Amount</label><input id="amount" type="number" step="0.01" min="0" inputmode="decimal" required></div>
        <div><label for="cat">Category</label><select id="cat"><option value="">Uncategorized</option></select></div>
        <div class="wide"><label for="notes">Notes</label><input id="notes" placeholder="Optional"></div>
        <div><button class="primary" id="save" type="submit">Add transaction</button> <button class="link hidden" id="cancel" type="button">Cancel</button></div>
      </form>
      <p class="err" id="formErr"></p>
    </div>

    <div class="panel">
      <div style="display:flex;justify-content:flex-end;gap:8px;margin-bottom:6px"><button id="importBtn">Import CSV</button><input type="file" id="importFile" accept=".csv,text/csv" class="hidden"><button id="csv">Export CSV</button></div>
      <div class="scroll" id="list"></div>
    </div>
  </div>
</section>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyArctgNlCFBL_JlU6O0nBX7C-7qrD0T_Uw",
  authDomain: "paris-family-budget.firebaseapp.com",
  projectId: "paris-family-budget",
  storageBucket: "paris-family-budget.firebasestorage.app",
  messagingSenderId: "852729416469",
  appId: "1:852729416469:web:be4fb801651cd6ebc7f71c"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth(), db = firebase.firestore();
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => Math.abs(n).toLocaleString("en-US",{style:"currency",currency:"USD"});
const signed = n => (n < 0 ? "\u2212" : "+") + fmt(n);
const today = () => { const d=new Date(); return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const showDate = s => `${s.slice(5,7)}/${s.slice(8)}/${s.slice(0,4)}`;
const store = { get(){ try{return localStorage.getItem("activePeriod")}catch(e){return null} }, set(v){ try{localStorage.setItem("activePeriod",v)}catch(e){} } };

let periods = [], activeId = null, items = [], editId = null, subId = null, unsubP = null, unsubT = null;
$("date").value = today();

auth.onAuthStateChanged(user => {
  $("login").classList.toggle("hidden", !!user);
  $("app").classList.toggle("hidden", !user);
  if (user) { $("who").textContent = user.email.split("@")[0]; subscribePeriods(); subscribeCats(); }
  else { if (unsubP) unsubP(); if (unsubT) unsubT(); unsubP = unsubT = null; subId = null; if (unsubC) unsubC(); unsubC = null; }
});
$("signIn").onclick = async () => {
  $("loginErr").textContent = "";
  try { await auth.signInWithEmailAndPassword($("em").value.trim(), $("pw").value); }
  catch (e) { $("loginErr").textContent = "Couldn't sign in. Check your email and password."; }
};
$("pw").addEventListener("keydown", e => { if (e.key === "Enter") $("signIn").click(); });
$("signOut").onclick = () => auth.signOut();

function subscribePeriods() {
  if (unsubP) unsubP();
  unsubP = db.collection("periods").orderBy("createdAt").onSnapshot(snap => {
    periods = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (!periods.some(p => p.id === activeId)) {
      const saved = store.get();
      activeId = periods.some(p => p.id === saved) ? saved : (periods.length ? periods[periods.length-1].id : null);
    }
    renderTabs(); subscribeTx();
  }, e => { $("tabs").innerHTML = `<p class="err">Couldn't load periods: ${esc(e.message)}</p>`; });
}

function renderTabs() {
  $("tabs").innerHTML = periods.map(p =>
    `<button class="tab" role="tab" aria-selected="${p.id===activeId}" data-id="${p.id}">${esc(p.name)}</button>`).join("")
    + `<button class="tab" id="newP">+ New period</button>`;
  $("noPeriod").classList.toggle("hidden", periods.length > 0);
  $("periodView").classList.toggle("hidden", !periods.length);
}
function selectPeriod(id) {
  activeId = id; store.set(id); resetForm(); renderTabs(); subscribeTx();
}
$("tabs").onclick = e => {
  if (e.target.id === "newP") return addPeriod();
  if (e.target.dataset.id) selectPeriod(e.target.dataset.id);
};
$("firstPeriod").onclick = addPeriod;

async function addPeriod() {
  const d = new Date();
  const def = d.toLocaleString("en-US", { month: "long", year: "numeric" });
  const name = (prompt("Name for the new budget period:", def) || "").trim();
  if (!name) return;
  const ref = await db.collection("periods").add({ name, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
  selectPeriod(ref.id);
}

function subscribeTx() {
  if (activeId === subId) return;
  if (unsubT) unsubT();
  subId = activeId; items = []; render();
  if (!activeId) return;
  unsubT = db.collection("expenses").where("periodId", "==", activeId).onSnapshot(snap => {
    items = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => b.date.localeCompare(a.date));
    render();
  }, e => { $("list").innerHTML = `<p class="err">Couldn't load transactions: ${esc(e.message)}</p>`; });
}

function render() {
  const cr = items.filter(x => x.amount > 0).reduce((s,x) => s + x.amount, 0);
  const db_ = items.filter(x => x.amount < 0).reduce((s,x) => s + x.amount, 0);
  const net = cr + db_;
  $("sCr").textContent = signed(cr); $("sDb").textContent = db_ ? signed(db_) : fmt(0);
  $("sNet").textContent = signed(net); $("sNet").className = "num " + (net < 0 ? "neg" : "pos");
  $("list").innerHTML = items.length
    ? `<table><thead><tr><th>Date</th><th>Description</th><th>Category</th><th class="r">Amount</th><th>Notes</th><th></th></tr></thead><tbody>` +
      items.map(x => `<tr><td class="num">${showDate(x.date)}</td><td>${esc(x.description)}</td><td class="note">${esc(catName(x.categoryId))}</td>
        <td class="r num amt ${x.amount < 0 ? "neg" : "pos"}">${signed(x.amount)}</td>
        <td class="note">${esc(x.notes || "")}</td>
        <td style="white-space:nowrap"><button class="link" data-edit="${x.id}">Edit</button><button class="link" data-del="${x.id}">Delete</button></td></tr>`).join("") + `</tbody></table>`
    : `<p class="empty">No transactions in this period yet. Add the first one above.</p>`;
  renderBreakdown();
}

$("list").onclick = async e => {
  const id = e.target.dataset.del || e.target.dataset.edit; if (!id) return;
  const x = items.find(i => i.id === id);
  if (e.target.dataset.del) {
    if (confirm(`Delete "${x.description}" (${signed(x.amount)})?`)) await db.collection("expenses").doc(id).delete();
  } else {
    editId = id; $("date").value = x.date; $("desc").value = x.description;
    $("type").value = x.amount < 0 ? "debit" : "credit"; $("amount").value = Math.abs(x.amount);
    $("notes").value = x.notes || ""; $("cat").value = x.categoryId || "";
    $("save").textContent = "Save changes"; $("cancel").classList.remove("hidden");
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
};

function resetForm() {
  editId = null; $("desc").value = ""; $("amount").value = ""; $("notes").value = ""; $("date").value = today();
  $("save").textContent = "Add transaction"; $("cancel").classList.add("hidden"); $("formErr").textContent = "";
}
$("cancel").onclick = resetForm;

$("form").addEventListener("submit", async () => {
  $("formErr").textContent = "";
  const raw = Math.round(parseFloat($("amount").value) * 100) / 100;
  if (!$("desc").value.trim() || !(raw >= 0) || !$("date").value) { $("formErr").textContent = "Fill in the date, description, and amount."; return; }
  const data = { date: $("date").value, description: $("desc").value.trim(), notes: $("notes").value.trim(),
                 amount: $("type").value === "debit" ? -raw : raw, periodId: activeId, categoryId: $("cat").value || null };
  try {
    if (editId) await db.collection("expenses").doc(editId).update(data);
    else await db.collection("expenses").add({ ...data, addedBy: auth.currentUser.email.split("@")[0], createdAt: firebase.firestore.FieldValue.serverTimestamp() });
    resetForm();
  } catch (e) { $("formErr").textContent = "Couldn't save: " + e.message; }
});

$("csv").onclick = () => {
  const q = s => `"${String(s).replace(/"/g,'""')}"`;
  const p = periods.find(p => p.id === activeId);
  const rows = [["Date","Description","Category","Amount","Notes","Added by"], ...items.map(x => [x.date,x.description,x.categoryId ? catName(x.categoryId) : "",x.amount.toFixed(2),x.notes||"",x.addedBy||""])];
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([rows.map(r => r.map(q).join(",")).join("\n")], { type: "text/csv" }));
  a.download = `budget-${(p ? p.name : "period").replace(/[^\w-]+/g,"-")}.csv`; a.click();
};

// ---- Categories ----
let categories = [], unsubC = null;
const catName = id => (categories.find(c => c.id === id) || {}).name || "Uncategorized";
function subscribeCats() {
  if (unsubC) unsubC();
  unsubC = db.collection("categories").onSnapshot(snap => {
    categories = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => a.name.localeCompare(b.name));
    renderCats(); render();
  }, e => { $("breakdown").innerHTML = `<p class="err">Couldn't load categories: ${esc(e.message)}</p>`; });
}
function renderCats() {
  const cur = $("cat").value;
  $("cat").innerHTML = `<option value="">Uncategorized</option>` + categories.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join("");
  $("cat").value = categories.some(c => c.id === cur) ? cur : "";
  $("catList").innerHTML = categories.length ? categories.map(c =>
    `<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)"><span>${esc(c.name)}</span><span><button class="link" data-ren="${c.id}">Rename</button><button class="link" data-rm="${c.id}">Remove</button></span></div>`).join("")
    : `<p class="empty">No categories yet. Add your first one above.</p>`;
}
$("catBtn").onclick = () => $("catMgr").classList.toggle("hidden");
$("addCat").onclick = addCat;
$("newCat").addEventListener("keydown", e => { if (e.key === "Enter") addCat(); });
async function addCat() {
  const name = $("newCat").value.trim(); if (!name) return;
  if (categories.some(c => c.name.toLowerCase() === name.toLowerCase())) { alert("That category already exists."); return; }
  await db.collection("categories").add({ name, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
  $("newCat").value = "";
}
$("catList").onclick = async e => {
  const c = categories.find(c => c.id === (e.target.dataset.ren || e.target.dataset.rm)); if (!c) return;
  if (e.target.dataset.ren) {
    const name = (prompt("Rename category:", c.name) || "").trim();
    if (!name || name === c.name) return;
    if (categories.some(o => o.id !== c.id && o.name.toLowerCase() === name.toLowerCase())) { alert("That category already exists."); return; }
    await db.collection("categories").doc(c.id).update({ name });
  } else if (confirm(`Remove "${c.name}"? Its transactions will show as Uncategorized.`)) {
    await db.collection("categories").doc(c.id).delete();
  }
};
function renderBreakdown() {
  const g = {};
  items.forEach(x => {
    const k = categories.some(c => c.id === x.categoryId) ? x.categoryId : "";
    g[k] = g[k] || { cr: 0, db: 0 };
    if (x.amount < 0) g[k].db += -x.amount; else g[k].cr += x.amount;
  });
  const rows = Object.entries(g).map(([k, v]) => ({ name: k ? catName(k) : "Uncategorized", ...v })).sort((a, b) => b.db - a.db || b.cr - a.cr);
  const tot = rows.reduce((s, r) => s + r.db, 0);
  $("breakdown").innerHTML = rows.length
    ? `<table><thead><tr><th>Category</th><th class="r">Debits</th><th class="r">Credits</th><th style="width:34%">Share of spending</th></tr></thead><tbody>` +
      rows.map(r => { const pct = tot ? r.db / tot * 100 : 0;
        return `<tr><td>${esc(r.name)}</td><td class="r num neg">${r.db ? "\u2212" + fmt(r.db) : "\u2014"}</td><td class="r num pos">${r.cr ? "+" + fmt(r.cr) : "\u2014"}</td><td><div style="display:flex;align-items:center;gap:8px"><div class="track"><div class="fill" style="width:${pct}%"></div></div><span class="num note">${pct.toFixed(0)}%</span></div></td></tr>`; }).join("") + `</tbody></table>`
    : `<p class="empty">Add transactions to see spending by category.</p>`;
}

// ---- CSV import: adds rows to the currently open period ----
$("importBtn").onclick = () => $("importFile").click();
$("importFile").onchange = async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try { await importCsv(await f.text()); } catch (err) { alert("Import failed: " + err.message); }
};
function parseCsv(t) {
  t = t.replace(/^\uFEFF/, ""); const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (q) { if (c === '"') { if (t[i+1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(cur); cur = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && t[i+1] === "\n") i++; row.push(cur); cur = ""; if (row.some(x => x.trim())) rows.push(row); row = []; }
    else cur += c;
  }
  row.push(cur); if (row.some(x => x.trim())) rows.push(row);
  return rows;
}
function parseDate(s) {
  s = String(s || "").trim(); let m;
  if (m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/)) return `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;
  if (m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/)) { const y = m[3].length === 2 ? "20" + m[3] : m[3]; return `${y}-${m[1].padStart(2,"0")}-${m[2].padStart(2,"0")}`; }
  const d = new Date(s); return isNaN(d) ? null : new Date(d - d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
}
function parseMoney(s) {
  s = String(s || "").trim(); if (!s) return null;
  const neg = /^\(.*\)$/.test(s) || /^\$?-/.test(s) || /-$/.test(s);
  const n = parseFloat(s.replace(/[^0-9.]/g, "")); return isNaN(n) ? null : (neg ? -n : n);
}
async function importCsv(text) {
  const p = periods.find(p => p.id === activeId); if (!p) throw new Error("Open a budget period tab first.");
  const rows = parseCsv(text); if (rows.length < 2) throw new Error("The file has no data rows.");
  const head = rows[0].map(h => h.trim().toLowerCase());
  const find = (...n) => head.findIndex(h => n.some(x => h.includes(x)));
  const iD = find("date"), iS = find("description", "desc", "payee", "merchant", "name"), iN = find("notes", "note", "memo", "comment");
  const iA = find("amount"), iDb = find("debit"), iCr = find("credit"), iC = find("category");
  if (iD < 0 || iS < 0 || (iA < 0 && iDb < 0 && iCr < 0)) throw new Error("The first row must be headers including Date, Description, and Amount (or Debit/Credit) columns.");
  let recs = [], skipped = 0;
  for (const r of rows.slice(1)) {
    const date = parseDate(r[iD]), desc = (r[iS] || "").trim();
    let amt;
    if (iA >= 0) amt = parseMoney(r[iA]);
    else { const d = parseMoney(r[iDb]), c = parseMoney(r[iCr]); amt = (d == null && c == null) ? null : (c || 0) - Math.abs(d || 0); }
    if (!date || !desc || amt == null) { skipped++; continue; }
    recs.push({ date, description: desc, notes: iN >= 0 ? (r[iN] || "").trim() : "", cat: iC >= 0 ? (r[iC] || "").trim() : "", amount: Math.round(amt * 100) / 100 });
  }
  if (!recs.length) throw new Error("No valid rows found. Check the date and amount formats.");
  if (iA >= 0 && recs.every(x => x.amount >= 0) &&
      confirm("Every amount in this file is positive.\n\nOK = treat them all as debits (money out)\nCancel = treat them all as credits (money in)"))
    recs = recs.map(x => ({ ...x, amount: -x.amount }));
  const ids = {}; categories.forEach(c => ids[c.name.toLowerCase()] = c.id);
  const newNames = {}; recs.forEach(r => { const k = r.cat.toLowerCase(); if (k && !ids[k] && !newNames[k]) newNames[k] = r.cat; });
  const nn = Object.keys(newNames).length;
  const cr = recs.filter(x => x.amount > 0), dbt = recs.filter(x => x.amount < 0);
  const sum = a => a.reduce((s, x) => s + x.amount, 0);
  if (!confirm(`Import ${recs.length} transactions into "${p.name}"?\n\nCredits: ${cr.length} (${signed(sum(cr))})\nDebits: ${dbt.length} (${signed(sum(dbt))})` + (nn ? `\n\n${nn} new categor${nn === 1 ? "y" : "ies"} will be created.` : "") + (skipped ? `\n\n${skipped} row(s) will be skipped (missing or unreadable date, description, or amount).` : ""))) return;
  for (const [k, n] of Object.entries(newNames)) ids[k] = (await db.collection("categories").add({ name: n, createdAt: firebase.firestore.FieldValue.serverTimestamp() })).id;
  const who = auth.currentUser.email.split("@")[0], pid = activeId;
  for (let i = 0; i < recs.length; i += 400) {
    const b = db.batch();
    recs.slice(i, i + 400).forEach(r => b.set(db.collection("expenses").doc(), { date: r.date, description: r.description, notes: r.notes, amount: r.amount, categoryId: ids[r.cat.toLowerCase()] || null, periodId: pid, addedBy: who, createdAt: firebase.firestore.FieldValue.serverTimestamp() }));
    await b.commit();
  }
  alert(`Imported ${recs.length} transactions.`);
}
</script>
